<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bili Live Danmaku · 控制台</title>
    <link rel="stylesheet" href="/static/admin.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">OBS OVERLAY CONSOLE</p>
          <h1>Bili Live Danmaku</h1>
          <p class="subtitle">B站直播弹幕 · Windows 浏览器源控制台</p>
        </div>
        <div class="topbar-actions">
          <span id="connectionBadge" class="badge">读取状态中</span>
          <button id="openOverlayBtn" class="button secondary" type="button">打开浮层</button>
          <button id="saveBtn" class="button primary" type="button">保存配置</button>
        </div>
      </header>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>

      <main class="workspace">
        <div class="settings-column">
          <section class="card">
            <div class="section-heading">
              <div>
                <p class="eyebrow">CONNECTION</p>
                <h2>直播间与凭据</h2>
              </div>
              <span id="cookieState" class="mini-badge">Cookie：未检查</span>
            </div>

            <label class="field wide">
              <span>直播间号或地址</span>
              <input id="room" type="text" placeholder="例如 5861873 或 https://live.bilibili.com/5861873" />
            </label>

            <label class="field wide">
              <span>Cookie 文件路径</span>
              <input id="cookieFile" type="text" spellcheck="false" />
              <small>明文保存。建议保留在应用数据目录，不要提交到 Git。</small>
            </label>

            <label class="field wide">
              <span>手动粘贴 Cookie</span>
              <textarea id="cookieText" rows="3" spellcheck="false" placeholder="SESSDATA=...; bili_jct=...; DedeUserID=..."></textarea>
              <small>导入后写入上面的文件；页面不会回显已保存的 Cookie。</small>
            </label>

            <div class="button-row">
              <label class="button secondary file-button">
                从文件导入
                <input id="cookieFileInput" type="file" accept=".txt,.cookie,text/plain" hidden />
              </label>
              <button id="importCookieBtn" class="button secondary" type="button">导入 Cookie</button>
              <button id="deleteCookieBtn" class="button danger" type="button">删除 Cookie</button>
            </div>

            <div class="inline-fields">
              <label class="field">
                <span>历史行数</span>
                <input id="historyLines" class="preview-field" type="number" min="0" max="2000" step="1" />
              </label>
              <label class="field">
                <span>入场合并（秒）</span>
                <input id="entryMerge" type="number" min="0" max="60" step="0.5" />
              </label>
              <label class="field">
                <span>礼物合并（秒）</span>
                <input id="giftMerge" type="number" min="0" max="60" step="0.5" />
              </label>
            </div>
            <label class="switch-row">
              <input id="autoConnect" type="checkbox" />
              <span>启动时自动连接直播间</span>
            </label>
            <div class="button-row">
              <button id="restartBtn" class="button secondary" type="button">重新连接</button>
              <button id="demoBtn" class="button secondary" type="button">发送测试弹幕</button>
            </div>
          </section>

          <section class="card">
            <div class="section-heading">
              <div>
                <p class="eyebrow">LAYOUT</p>
                <h2>画布与底板</h2>
              </div>
            </div>
            <div class="inline-fields three">
              <label class="field">
                <span>画布宽度</span>
                <input id="width" class="preview-field" type="number" min="240" max="1920" />
              </label>
              <label class="field">
                <span>画布高度</span>
                <input id="height" class="preview-field" type="number" min="240" max="1920" />
              </label>
              <label class="field">
                <span>圆角</span>
                <input id="panelRadius" class="preview-field" type="number" min="0" max="80" />
              </label>
            </div>
            <div class="inline-fields three">
              <label class="field">
                <span>内边距</span>
                <input id="panelPadding" class="preview-field" type="number" min="0" max="64" />
              </label>
              <label class="field">
                <span>行间距</span>
                <input id="rowGap" class="preview-field" type="number" min="0" max="32" />
              </label>
              <label class="field">
                <span>最多行数</span>
                <input id="maxMessages" class="preview-field" type="number" min="5" max="500" />
              </label>
            </div>
            <div class="inline-fields three color-grid">
              <label class="field">
                <span>底板颜色</span>
                <input id="panelBackground" class="preview-field color-input" type="color" />
              </label>
              <label class="field">
                <span>底板透明度</span>
                <input id="panelOpacity" class="preview-field" type="range" min="0" max="1" step="0.01" />
                <output id="panelOpacityValue"></output>
              </label>
              <label class="field">
                <span>边框透明度</span>
                <input id="panelBorderOpacity" class="preview-field" type="range" min="0" max="1" step="0.01" />
                <output id="panelBorderOpacityValue"></output>
              </label>
            </div>
            <div class="inline-fields two">
              <label class="field">
                <span>边框颜色</span>
                <input id="panelBorder" class="preview-field color-input" type="color" />
              </label>
              <label class="switch-row compact">
                <input id="showStatus" class="preview-field" type="checkbox" />
                <span>显示连接状态</span>
              </label>
            </div>
          </section>

          <section class="card">
            <div class="section-heading">
              <div>
                <p class="eyebrow">TYPOGRAPHY</p>
                <h2>字体与颜色</h2>
              </div>
            </div>
            <div class="inline-fields two">
              <label class="field">
                <span>字体</span>
                <select id="fontFamily" class="preview-field"></select>
              </label>
              <label class="field">
                <span>字号（px）</span>
                <input id="fontSize" class="preview-field" type="number" min="12" max="72" />
              </label>
            </div>
            <div class="button-row">
              <label class="button secondary file-button">
                选择字体文件
                <input id="fontFile" type="file" accept=".ttf,.otf,.ttc,.woff,.woff2" hidden />
              </label>
              <button id="uploadFontBtn" class="button secondary" type="button">上传并应用字体</button>
              <small>支持 CJK 字体大文件，单个字体最大 64 MB；选择文件后会自动上传。</small>
            </div>
            <div class="inline-fields three color-grid">
              <label class="field">
                <span>正文</span>
                <input id="textColor" class="preview-field color-input" type="color" />
              </label>
              <label class="field">
                <span>次要文字</span>
                <input id="mutedColor" class="preview-field color-input" type="color" />
              </label>
              <label class="field">
                <span>强调色</span>
                <input id="accentColor" class="preview-field color-input" type="color" />
              </label>
            </div>
          </section>
        </div>

        <aside class="preview-column">
          <section class="card preview-card">
            <div class="section-heading">
              <div>
                <p class="eyebrow">LIVE PREVIEW</p>
                <h2>OBS 预览</h2>
              </div>
              <div class="button-row">
                <button id="previewDemoBtn" class="button secondary small" type="button">发送测试消息</button>
                <button id="copyOverlayBtn" class="button secondary small" type="button">复制地址</button>
              </div>
            </div>
            <div id="previewViewport" class="preview-viewport">
              <div id="previewStage" class="preview-stage">
                <iframe id="previewFrame" src="/overlay" title="OBS 浮层预览"></iframe>
              </div>
            </div>
            <div class="obs-help">
              <p><strong>OBS 浏览器源地址</strong></p>
              <code id="overlayUrl"></code>
              <p>宽度和高度使用上方画布尺寸；勾选透明背景，FPS 建议 30。</p>
            </div>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/static/admin.js"></script>
  </body>
</html>
