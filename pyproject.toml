[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bili-live-danmaku"
version = "0.3.2"
description = "Transparent Bilibili live chat overlay for OBS Browser Source"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vincent Zyu" }]
keywords = ["bilibili", "danmaku", "obs", "overlay", "pc"]
dependencies = [
  "brotli>=1.1.0",
  "edge-tts>=7.3.1",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "langdetect>=1.0.9",
  "miniaudio>=1.71",
  "python-multipart>=0.0.20",
  "ruamel.yaml>=0.18.6",
  "uvicorn[standard]>=0.34.0",
  "websockets>=15.0",
]

[project.scripts]
bili-live-danmaku = "bili_live_danmaku.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bili_live_danmaku"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bili_live_danmaku"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["brotli", "langdetect", "miniaudio", "ruamel.yaml"]
ignore_missing_imports = true
