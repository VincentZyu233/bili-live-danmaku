version: 3

# B站直播间
room: "5861873"
auto_connect: true

# 本地 WebUI
server:
  host: "127.0.0.1"
  port: 6161
  open_browser: true

# Cookie 路径相对于项目根目录；建议只放在本地并确保不提交
cookie_file: "config/cookie.txt"

# 历史记录和缓存均保存在项目目录内
storage:
  data_dir: "data"
history_lines: 60

# 入场和礼物事件的合并窗口
entry_merge_seconds: 5.0
gift_merge_seconds: 5.0

# B站断线重连退避
reconnect:
  base_seconds: 1.0
  max_seconds: 30.0

tts:
  enabled: false

  # 检测结果不明确时按此顺序回退；只填写下面 voices 中已启用的语言
  language_priority: [zh, en, ja, ko, es, fr, de, pt, ru, it]

  # 推荐音色：
  # zh: XiaoxiaoNeural 温柔女声 / XiaoyiNeural 活泼女声
  #     YunxiNeural 年轻男声 / YunjianNeural 稳重男声 / YunyangNeural 播报男声
  # en: AvaMultilingualNeural 自然女声 / EmmaMultilingualNeural 清晰女声
  #     AndrewMultilingualNeural 自然男声 / BrianMultilingualNeural 沉稳男声
  # ja: NanamiNeural 友好女声 / KeitaNeural 男声
  # ko: SunHiNeural 女声 / InJoonNeural 男声 / HyunsuMultilingualNeural 多语种男声
  # es: XimenaNeural 女声 / AlvaroNeural 男声 / ElviraNeural 成熟女声
  # fr: VivienneMultilingualNeural 女声 / RemyMultilingualNeural 男声
  # de: SeraphinaMultilingualNeural 女声 / FlorianMultilingualNeural 男声
  # pt: ThalitaMultilingualNeural 女声 / AntonioNeural 男声
  # ru: SvetlanaNeural 女声 / DmitryNeural 男声
  # it: ElsaNeural 女声 / GiuseppeMultilingualNeural 多语种男声
  voices:
    zh: zh-CN-XiaoxiaoNeural
    en: en-US-AvaMultilingualNeural
    ja: ja-JP-NanamiNeural
    ko: ko-KR-SunHiNeural
    es: es-ES-XimenaNeural
    fr: fr-FR-VivienneMultilingualNeural
    de: de-DE-SeraphinaMultilingualNeural
    pt: pt-BR-ThalitaMultilingualNeural
    ru: ru-RU-SvetlanaNeural
    it: it-IT-ElsaNeural

  rate: "+0%"
  volume: "+0%"
  pitch: "+0Hz"
  read_kinds:
    - text
    - gift
    - entry
    - like
    - paid
    - membership
  include_username: true
  max_chars: 180
  queue_size: 32
  min_interval_ms: 300

logging:
  level: INFO

theme:
  width: 480
  height: 1080
  font:
    family: "LXGW WenKai Mono"
    size: 28
    url: null
  panel_background: "#0b0d12"
  panel_opacity: 0.58
  panel_radius: 28
  panel_border: "#ffffff"
  panel_border_opacity: 0.12
  panel_padding: 18
  row_gap: 8
  text_color: "#f4f6fb"
  muted_color: "#aeb5c2"
  accent_color: "#ffd66b"
  show_status: true
  max_messages: 80
